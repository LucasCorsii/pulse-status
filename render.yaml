services:
  - type: web
    name: pulse-status-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    branch: codex/phase-0
    region: virginia
    plan: 0.5c-512mb
    autoDeployTrigger: checksPass
    healthCheckPath: /api/v1/health
    preDeployCommand: npm run db:migrate --workspace @pulse-status/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: '10000'
      - key: DATABASE_URL
        fromDatabase:
          name: pulse-status-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: pulse-status-redis
          type: keyvalue
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: COOKIE_SAMESITE
        value: lax
      - key: COOKIE_SECURE
        value: '1'
      - key: COOKIE_DOMAIN
        value: ''
      - key: SMTP_FROM
        value: pulse-status@localhost

  - type: keyvalue
    name: pulse-status-redis
    region: virginia
    plan: 256mb
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

databases:
  - name: pulse-status-db
    region: virginia
    plan: 0.1c-256mb
    ipAllowList: []
    postgresMajorVersion: '16'
    databaseName: pulse_status
    user: pulse
