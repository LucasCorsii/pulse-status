name: CI

on:
  push:
    branches: [main, 'codex/**', 'opencode/**']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pulse_status_test
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulse -d pulse_status_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pulse:pulse_test@localhost:5432/pulse_status_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters-long
      SKIP_QUEUE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run format:check
      - run: npm run lint
      - run: npm test --if-present
      - run: npm run db:migrate --workspace @pulse-status/api
      - run: npm run test:codex
      - run: npm run build
